{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-primary display-4"></i>
                    <h3 class="fw-bold mt-2">استعادة كلمة السر</h3>
                    <p class="text-muted small">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لتعديل كلمة السر.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.email.label_tag }}
                        {{ form.email }}
                        {% if form.email.errors %}
                            <div class="text-danger small">{{ form.email.errors }}</div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">إرسال رابط الاستعادة</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
