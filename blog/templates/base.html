{% load static %}
{% load blog_tags %}
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <!--          # الـ Favicon هي "البصمة البصرية" لمدونتك في المتصفح.-->
    <!--        # وظيفتها: تجعل موقعك مميزاً بين عشرات التبويبات المفتوحة.-->
    <!--        # هي التفصيلة الصغيرة التي تفرق بين "مشروع برمجي" و "موقع ويب حقيقي".-->

    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>مدونة الوافي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <!-- رابط خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  </head>
  <body>

    {% include 'partials/header.html' %}
    <!-- محتوى الصفحات -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
    {% include 'partials/footer.html' %}
        <!-- حاوية التنبيهات -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000;">
        {% if messages %}
            {% for message in messages %}
                <div class="toast show align-items-center text-white bg-success border-0 shadow-lg mb-2"
                     role="alert" id="myToast{{ forloop.counter }}">
                    <div class="d-flex">
                        <div class="toast-body fw-bold">
                            <i class="bi bi-check-circle-fill me-2"></i> {{ message }}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            {% endfor %}
        {% endif %}
    </div>


    <!-- رابط الجافاسكربت -->
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
                crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net"></script>
    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
