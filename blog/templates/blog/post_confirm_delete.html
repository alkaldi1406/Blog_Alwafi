{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-lg rounded-4 p-4">
                <div class="card-body">
                    <i class="bi bi-exclamation-triangle text-danger display-1 mb-4"></i>
                    <h2 class="fw-bold mb-3">تأكيد الحذف</h2>
                    <p class="text-muted mb-4 lead">
                        هل أنت متأكد من رغبتك في حذف مقال: <br>
                        <strong class="text-dark">"{{ post.title }}"</strong>؟ <br>
                        <span class="text-danger small">هذا الإجراء لا يمكن التراجع عنه.</span>
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <!-- زر الحذف الحقيقي (POST) -->
                            <button type="submit" class="btn btn-danger rounded-pill px-5 fw-bold">
                                نعم، احذف المقال
                            </button>
                            <!-- زر التراجع -->
                            <a href="{% url 'blog:user_dashboard' %}" class="btn btn-light rounded-pill px-5">
                                إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
