{% extends 'base.html' %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-lg rounded-5 overflow-hidden bg-white p-5">
                <!-- أيقونة التحذير المتحركة -->
                <div class="mb-4">
                    <i class="bi bi-shield-lock-fill text-danger display-1 shadow-sm rounded-circle p-3 bg-danger-subtle"></i>
                </div>

                <h1 class="fw-bold text-dark mb-3">دخول غير مصرح به! (403)</h1>

                <p class="lead text-muted mb-4 px-md-5">
                    عذراً، هذه الصفحة مخصصة فقط لـ <strong>فريق إدارة مدونة الوافي</strong>.
                    يبدو أنك حاولت الوصول لمنطقة محظورة لا تملك صلاحية دخولها.
                </p>

                <div class="d-flex gap-3 justify-content-center">
                    <a href="{% url 'blog:index' %}" class="btn btn-primary rounded-pill px-5 fw-bold py-3 shadow-sm">
                        العودة للرئيسية <i class="bi bi-house-door ms-2"></i>
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4 fw-bold py-3">
                        تراجع للخلف <i class="bi bi-arrow-right ms-2"></i>
                    </a>
                </div>

                <div class="mt-5 pt-3 border-top">
                    <p class="small text-muted mb-0">إذا كنت تعتقد أن هذا خطأ، يرجى التواصل مع الإدارة.</p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
